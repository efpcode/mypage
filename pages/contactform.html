      href="../mockups/logo.png"
      sizes="512x512"
      type="image/png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link href="../css/style.css" rel="stylesheet" />
  </head>
  <body class="dark-mode">
    <header class="site-header site-header--hidden">
      <div class="site-header__top">
        <a href="/" class="site-header__logo-link">
          <img
            src="../mockups/logo.png"
            alt="my logo"
            class="site-header__logo"
        /></a>

        <button
          aria-label="Toggle light mode"
          aria-pressed="true"
          type="button"
          class="site-header__light-or-darkmode-toggle site-header__button"
        >
          &#x1F4A1;
        </button>

        <button
          aria-label="Toggle navigation menu"
          aria-expanded="false"
          type="button"
          class="site-header__menu-toggle site-header__button"
        >
          &#9776;
        </button>
      </div>

      <nav class="site-header__nav">
        <ul class="site-header__nav-list">
          <li class="site-header__nav-item">
            <a class="site-header__nav-link" href="/">Home</a>
          </li>
          <li class="site-header__nav-item">
            <a class="site-header__nav-link" href="../about.html">About me</a>
          </li>
          <li class="site-header__nav-item">
            <a class="site-header__nav-link" href="./contactform.html"
              >Contact Me</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main class="pagecontent">
      <h1 class="pagecontent__main-heading">Contact Form</h1>

      <section class="pagecontent__section">
        <h2 class="pagecontent__section-heading">Get in touch!</h2>
        <form class="form">
          <fieldset class="form__fieldset form__fieldset--name-email">
            <div class="form__group form__group--name">
              <label class="form__label  for="form-name"
                >Please enter your full legal name
              </label>
              <input
                id="form-name"
                class="form__input"
                type="text"
                name="full-name"
                value=""
                placeholder="Enter full name here..."
                required
                aria-describedby="nameFieldHelp"
              />
              <small class="form__help-text" id="nameFieldHelp"
                ></small
              >
            </div>
            <div class="form__group form__group--email">
              <label class="form__label" for="form-email"
                >Please enter your email
              </label>
              <input
                id="form-email"
                class="form__input"
                type="email"
                name="email"
                placeholder="Enter email here..."
                value=""
                required
                aria-describedby="emailFieldHelp"
              />
              <small class="form__help-text" id="emailFieldHelp"
                ></small
              >
            </div>
          </fieldset>

          <div class="form__group form__group--subject">
            <label class="form__label" for="form-subject">Form Subject</label>
            <select
              class="form__input"
              id="form-subject"
              name="form-subject"
              aria-describedby="menuOptionsHelp"
              required
            >
              <option class="form__option" disabled selected hidden value="">
                Please select a subject
              </option>
              <option class="form__option" value="internship">
                internship (LIA)
              </option>
              <option class="form__option" value="consultant">
                Consultant
              </option>
              <option class="form__option" value="employment">
                Employment
              </option>
            </select>
            <small class="form__help-text" id="menuOptionsHelp"
              ></small
            >
          </div>
          <div class="form__group form__group--textarea">
            <label class="form__label" for="textarea"
              >Please enter your message</label
            >
            <textarea
              id="textarea"
              required
              class="form__textarea"
              aria-describedby="textareaFieldHelp"
              placeholder="Type your message"
              name="textarea"
              rows="6"
              cols="42"
            ></textarea>
            <small class="form__help-text" id="textareaFieldHelp">
            </small>
          </div>

          <div class="form__actions form__group--buttons">
            <button
              id="submit-button"
              class="form__button form__button--primary"
              type="submit"
            >
              Send
            </button>
            <button
              id="cancel-button"
              class="form__button form__button--secondary"
              type="reset"
            >
              Cancel
            </button>
          </div>
        </form>
      </section>
    </main>

    <footer>
      <section class="site-footer">
        <ul class="site-footer__social-list">
          <li class="site-footer__social-item">

          <li class="site-footer__social-item">

          <li class="site-footer__social-item">

        <h5 class="site-footer__copyright">© 2025 Esteban Fernandez Parada</h5>
